[project]
name = "foodlog"
version = "0.1.0"
description = "Track food purchases, nutrition, and consumption with SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
default-groups = ["dev", "test"]
dev-dependencies = ["foodlog"]

[dependency-groups]
dev = [
	"jupyter",
	"notebook",
]
test = [
    "pytest>=7.0.0; python_version == '3.10'",
    "pytest>=7.0.0; python_version == '3.11'",
    "pytest>=7.0.0; python_version == '3.12'",
    "pytest>=7.0.0; python_version == '3.13'",
    "pytest>=8.0.0; python_version == '3.14'",
    "pytest-cov",
    "pytest-html",
]



