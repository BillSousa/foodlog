name: py3.10

on:
  push:
    branches:
      - main
#  pull_request:
#    branches:
#      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies with uv
      run: uv sync

    - name: Run tests on linux
      if: matrix.os == 'ubuntu-latest'
      run: xvfb-run -a uv run pytest tests/ --doctest-modules -v --maxfail=1 --disable-warnings
      timeout-minutes: 120

    - name: Run tests on windows
      if: matrix.os == 'windows-latest'
      run: uv run pytest tests/ --doctest-modules -v --maxfail=1 --disable-warnings
      timeout-minutes: 120